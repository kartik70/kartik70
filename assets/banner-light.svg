<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Kartik, freelance developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eaf0f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" rx="16" fill="url(#bg)"/>
  <g fill="none" stroke="#3b82f6" stroke-opacity="0.10" stroke-width="2">
    <circle cx="1120" cy="150" r="60"/>
    <circle cx="1120" cy="150" r="110"/>
    <circle cx="1120" cy="150" r="160"/>
    <circle cx="1120" cy="150" r="210"/>
  </g>
  <text x="80" y="82" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3.5" fill="#64748b">FREELANCE DEVELOPER</text>
  <text x="80" y="164" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#0f172a">Kartik</text>
  <rect x="82" y="188" width="72" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="236" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#475569">I build complete applications, with AI built in where it helps.</text>
